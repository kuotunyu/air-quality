# 影響台灣空氣品質的事件時間軸 —— M5 政策因果分析使用。
#
# ⚠️ 讀這份檔案之前先讀這段。
#
# 每一筆都有 `verified`，而且 **M5 預設只使用 verified: true 的事件**。
# 這不是形式：一個錯的日期不會讓程式壞掉，它會讓事件研究對齊到錯誤的時點，
# 然後把噪音報告成政策效果——看起來完全合理。
#
# `verified: true` 的條件：
#   1. `source_url` 是實際打開並讀過的頁面
#   2. 該頁面**確實記載**這裡宣稱的日期
#   3. 若 `end` 不為 null，`source_url_end` 也要滿足同樣條件
#
# `source_quality` 記錄來源的層級，因為「查證過」和「權威」是兩件事：
#   official  —— 主管機關自己的公告
#   news      —— 有日期的新聞報導，直接引述當事人
#   tertiary  —— 維基百科等二手彙整（可用，但要知道自己在用什麼）
#
# ── 這份檔案的來歷 ────────────────────────────────────────────────
# 初版由 AI agent 編纂六筆，逐筆核對後只有一筆通過：四筆共用同一個空污法沿革頁
# （該頁不含深澳、機車補助、六輕任何一項），一筆連結是錯誤頁，一筆引用的法規
# 沿革頁不可能記載指揮中心的發布。真實的 URL 被配上了來自別處的日期。
#
# 2026-07-29 逐筆重查，現況：3 筆可用、2 筆確認查不到、1 筆不適合當事件。
# ==============================================================================

