# 測項定義：代碼、單位、中文名、物理合理值域。
#
# 單位與中文名逐字取自環境部隨年度資料包附上的
# `ReadMe_普通測站20170301.odt`（見 docs/data-sources.md）。
#
# `valid_range` 是本專案自訂的物理合理域，用於 QC 標記（不是刪除）。
# 超出範圍者標記為 out_of_range，保留原值供檢視。

sentinels:
  # 888/999 是哨兵碼，不是角度。這是本專案最關鍵的資料陷阱之一。
  #
  # ⚠️ 兩版官方 ReadMe 對這兩個碼的定義**互相矛盾**：
  #
  #   2017 版：「風向資料888代表無風，999則代表儀器故障」
  #   2001 版（檔名 ReadMe_普通測站_20090901.txt）：
  #           「888 表示風向不定」「999 表示靜風」
  #
  # 用資料本身裁決（見 docs/data-quality.md 與 tests/test_sentinels.py）：
  # 取 1993–2004 年風向哨兵碼觸發的時刻，看**同一時刻有效的風速值**——
  #
  #   999：中位數風速 0.00 m/s，81.3% 低於 0.5 m/s  → 這是靜風
  #   888：中位數風速 0.43 m/s，53.3% 低於 0.5 m/s  → 風弱但有風，方向不定
  #   （對照組：正常風向的中位數風速 1.84 m/s）
  #
  # 儀器故障與風速之間不該有這種關係。**2001 版的定義才對。**
  # 而哨兵碼只出現在 1993–2004 年，正是 2001 版說明所涵蓋的年代，
  # 所以這個對照適用於資料中每一次實際出現。
  "wind_direction":
    888: variable_direction   # 風向不定
    999: calm                 # 靜風

pollutants:
  "SO2":
    name_zh: 二氧化硫
    unit: ppb
    valid_range: [0, 500]
  "CO":
    name_zh: 一氧化碳
    unit: ppm
    valid_range: [0, 50]
  "O3":
    name_zh: 臭氧
    unit: ppb
    valid_range: [0, 500]
  "PM10":
    name_zh: 懸浮微粒
    unit: ug/m3
    valid_range: [0, 2000]
  "PM2.5":
    name_zh: 細懸浮微粒
    unit: ug/m3
    valid_range: [0, 1000]
    # 官方 ReadMe 原文：「PM2.5 自動監測尚無標準方法，其小時值僅供預警參考，
    # 不宜直接與 PM2.5 空氣品質標準之 24 小時值（35 微克/立方公尺）比較」
    # 測量方法為貝他射線衰減法。
    caveat: hourly_values_are_advisory_only
  "NOx":
    name_zh: 氮氧化物
    unit: ppb
    valid_range: [0, 1000]
    # NO + NO2 = NOx 為恆等式。三者不可同時進入線性模型
    # （2018 原專題的逐步剔除震盪即源於此）。
    identity: NO + NO2
  "NO":
    name_zh: 一氧化氮
    unit: ppb
    valid_range: [0, 1000]
  "NO2":
    name_zh: 二氧化氮
    unit: ppb
    valid_range: [0, 500]
  "THC":
    name_zh: 總碳氫合物
    unit: ppm
    valid_range: [0, 50]
  "NMHC":
    name_zh: 非甲烷碳氫化合物
    unit: ppm
    valid_range: [0, 50]
    identity: THC - CH4
  "CH4":
    name_zh: 甲烷
    unit: ppm
    valid_range: [0, 50]
  "UVB":
    name_zh: 紫外線指數
    unit: UVI
    valid_range: [0, 20]
  "AMB_TEMP":
    name_zh: 大氣溫度
    unit: degC
    valid_range: [-10, 50]
  "RAINFALL":
    name_zh: 雨量
    unit: mm
    valid_range: [0, 500]
    # 「NR」（無降雨）對雨量而言是**測到零**，不是缺值。
    # 環境部逐時資料中約 90% 的雨量格位是 NR；若把它們排除，
    # 「平均雨量」就變成「下雨時的平均雨強」，數值差一個量級。
    no_rain_is_zero: true
  "RH":
    name_zh: 相對溼度
    unit: percent
    valid_range: [0, 100]
  "WIND_SPEED":
    name_zh: 風速（每小時最後 10 分鐘算術平均）
    unit: m/s
    valid_range: [0, 100]
  "WIND_DIREC":
    name_zh: 風向（每小時最後 10 分鐘向量平均）
    unit: degree
    valid_range: [0, 360]
    circular: true
    sentinel_set: wind_direction
  "WS_HR":
    name_zh: 風速小時值（整個小時算術平均）
    unit: m/s
    valid_range: [0, 100]
  "WD_HR":
    name_zh: 風向小時值（整個小時向量平均）
    unit: degree
    valid_range: [0, 360]
    circular: true
    sentinel_set: wind_direction
  "PH_RAIN":
    name_zh: 酸鹼值（酸雨）
    unit: pH
    valid_range: [0, 14]
    # 沒下的雨其 pH 未定義，**不是 0**（pH 0 是強酸）。
    no_rain_is_zero: false
  "RAIN_COND":
    name_zh: 導電度（酸雨）
    unit: uS/cm
    valid_range: [0, 10000]
    # 同 PH_RAIN：未定義而非零。
    no_rain_is_zero: false

# 物理一致性規則。違反者標記，不刪除；違反率本身是研究發現。
consistency_rules:
  - name: pm_subset
    expr: "PM2.5 <= PM10"
    note: PM2.5 依定義為 PM10 的子集
  - name: nox_identity
    expr: "abs(NO + NO2 - NOx) <= 0.1 * NOx + 1"
    note: 容差涵蓋四捨五入誤差
  - name: nmhc_identity
    expr: "abs(THC - CH4 - NMHC) <= 0.05 * THC + 0.05"
