# 測站別名、類型與空品區。
#
# 別名對照是**必要**的：環境部在資料歷程中改過測站的正字法寫法，
# 未正規化的話同一個測站會在時間序列中斷成兩段。

# 正規化目標採用**現行官方寫法**（臺），因為未來新增的資料與 API 都用這個寫法。
# 舊資料（至少到 2010 年）用「台」。
#
# 實測確認：兩種寫法**從未在同一年同時出現**，
# 因此這是單純的改名，不是兩個不同測站。
aliases:
  台南: 臺南
  台東: 臺東
  台西: 臺西

# 空品區。舊格式（1982–2017）把空品區寫在壓縮檔的資料夾路徑裡，
# 例如 `99年 中部空品區/99年二林站_20110329.csv`，
# 新格式（2018+）是扁平結構，沒有這個資訊。
#
# 因此 `twair.store.stations` 從舊年份的 source_member 反推空品區，
# 再套用到新年份。此處僅列出無法從路徑取得者的手動補充。
airzone_overrides:
  # 離島空品區自 2018 年起才獨立分區，舊資料中不存在。
  金門: 離島
  馬公: 離島
  馬祖: 離島
  # 富貴角站設於新北市石門區（台灣本島最北端），僅存在於新格式年份，
  # 無舊路徑可反推。地理位置明確屬北部空品區。
  富貴角: 北部空品區

# 測站類型。取自 1994 年資料包內附 ReadMe 的分類。
#
# 2018 年原始畢業專題因為「五種類別測站測項不同」而只採用共通測項；
# 本專案改為把測站類型當作模型變數——交通站與背景站的 PM2.5
# 驅動因子本來就應該不同，這是資訊而非雜訊。
#
# 未列出者預設為「一般空氣品質監測站」。
station_types:
  industrial:   # 工業空氣品質監測站
    - 頭份
    - 線西
    - 麥寮
    - 臺西
    - 前鎮
  traffic:      # 交通空氣品質監測站
    - 鳳山
    - 三重
    - 中壢
    - 永和
    - 復興
    - 大同
  national_park:  # 國家公園空氣品質監測站
    - 恆春        # 兼一般測站
    - 陽明
  background:   # 背景空氣品質監測站
    - 萬里        # 兼一般測站
    - 觀音
    - 三義        # 兼一般測站
    - 橋頭
  reference:    # 參考測站
    - 關山
    - 埔里

# 兼具兩種身分的測站（ReadMe 明載）。分析時若要嚴格區分需特別處理。
dual_role:
  - 恆春
  - 萬里
  - 三義

default_station_type: general
