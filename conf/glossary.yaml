# Technical terms the published site uses, and where it explains them.
#
# The six prose gates before this one all ask the same question — does a number
# retyped into prose still equal the number that produced it. None of them asks
# whether a reader can understand the sentence the number sits in. The site is
# written for people who do not already know what a conformal interval is, and
# `PLAN.md` Phase 8 keeps a non-expert reading deferred for want of a
# participant, so nothing at all was watching the vocabulary.
#
# What a gate can decide mechanically is narrow but real: **a term the site has
# committed to explaining must still carry that explanation, near the place a
# reader first meets it.** It cannot decide whether the explanation is any good.
# That is review, not regex — the same boundary `docs/working-rules.md` draws
# around the two delegated claims in the site-prose gate.
#
# `window` is measured rather than chosen, and the gate prints every term's
# actual distance on every run, so the live values are always in the output
# rather than in this comment. Calibrating it at `ab66b34` the explained terms
# ran from 5 to 70 characters and the nearest unexplained one was 366, with
# nothing in between — so 160 sits inside an empty gap rather than against a
# boundary, and moving it fifty either way would change nothing.
#
# Those two numbers are a snapshot and will move with any edit above them on the
# page. That is why they are the only two here: an earlier version of this file
# listed a distance for all thirteen terms, seven of which were already wrong on
# the day they were written, because they had been measured with a draft of the
# extractor rather than the one that ships. Distances belong in the output.
"window": 160

# `explains` is a substring that must still appear on `route`, within `window`
# characters of the term's first use there. Choose the shortest phrase that
# actually carries the meaning — a longer quote is a longer hostage to rewording,
# and rewording the sentence is allowed. If a gate failure is a reword rather
# than a loss, the fix is to update the anchor here in the same commit.
#
# What counts as an explanation is the site's own habit: a phrase that turns the
# term into a claim about the world. 「它根本不看今天發生什麼事」 explains
# climatology without defining it, and that is the standard here — operational
# meaning, not a textbook entry.
#
# `explains: null` records a term used with no explanation anywhere on its route.
# These are not exemptions and nothing is switched off for them: the gate still
# requires the term to be present, so a stale entry is caught, and it prints
# every one of them on every run — a measured deficit, listed so that it is
# visible and countable rather than merely true.
#
# **The list is empty.** It held eight terms when this gate was written and all
# eight are explained on the page now. Reach for `null` when a term is used and
# not explained and the explanation is not yours to write today; do not reach for
# it to make a run go green.
#
# `why` is a claim about the page like any other — three of the first eight were
# wrong, and each was wrong by naming the wrong element as the place of first
# use. Check the page before writing one.
"terms":
  # ── Chapter 4: the pattern the rest of the site should follow ──────────────
  - "term": "CBPF"
    "route": "/sources/"
    "explains": "描述條件機率"

  # ── Chapter 5 ─────────────────────────────────────────────────────────────
  - "term": "偵測極限"
    "route": "/detection/"
    "explains": "分析方法也有偵測極限"
  - "term": "安慰劑"
    "route": "/detection/"
    "explains": "沒有事件標記時"

  # ── Chapter 6 ─────────────────────────────────────────────────────────────
  - "term": "climatology"
    "route": "/forecast/"
    "explains": "它根本不看今天發生什麼事"
  - "term": "rolling-origin"
    "route": "/forecast/"
    "explains": "過去訓練、未來測試"
  - "term": "R²"
    "route": "/forecast/"
    "explains": "都是無單位的比例"
  - "term": "skill"
    "route": "/forecast/"
    "explains": "都是無單位的比例"
  - "term": "split conformal"
    "route": "/forecast/"
    "explains": "只用訓練期的前 80% 擬合"
  # 圖 6.1's legend names both baselines and its caption used to gloss only one,
  # so `climatology` passed while its neighbour — same legend, same sentence —
  # sat 606 characters from the nearest explanation. The caption now introduces
  # both as rules rather than models, which is what they have in common and what
  # a reader needs before reading the chart. That insertion is also why
  # `climatology` measures further out than it used to: the run prints both.
  - "term": "persistence"
    "route": "/forecast/"
    "explains": "說「下一小時就跟現在一樣」"

  # ── Chapter 7 ─────────────────────────────────────────────────────────────
  - "term": "反事實"
    "route": "/health/"
    "explains": "以什麼濃度作為比較基準"

  # ── Chapter 3 ─────────────────────────────────────────────────────────────
  # 圖 3.1's caption does not define Moran's I, and does something better for a
  # reader: it says what a value of it means about the map. That is the same
  # standard climatology is held to.
  - "term": "Moran"
    "route": "/space/"
    "explains": "同號相聚"
  # The one entry the window cannot see, and it is the window that is wrong here
  # rather than the page. 圖 3.1's caption defines 殘差 immediately after naming
  # it, which is where a reader looking at the correlogram is — but the flattened
  # text puts 259 characters between that and the term's first appearance in
  # 「本章的三個問題」, because the correlogram's own axis values and per-band
  # numbers lie in between. A reader scans those; they do not read them.
  #
  # It cannot be moved higher. The chapter's opening clears PRODUCT.md's 「primary
  # plot above 55vh」 rule by 13px at 1280×720, and one line of prose costs 37px,
  # so a gloss above the figure pushes the evidence below the fold — measured,
  # after `check_site_quality.mjs` failed on exactly that.
  #
  # Widening the window to admit this would be tuning a threshold to fit a case.
  # The honest alternative — teaching `distance_for` to skip a plot's internals —
  # is a change to the instrument, and it belongs in its own commit with its own
  # evidence: measured across all 17 terms it moves 13 of them by zero, but it
  # would lose 安慰劑, whose gloss sits inside a figure and outside its caption.
  - "term": "殘差"
    "route": "/space/"
    "explains": null
    "why": "解釋在圖 3.1 圖說，讀者看得到；但相關圖的資料標籤夾在中間，攤平後距離 259"
  - "term": "虛無分布"
    "route": "/space/"
    "explains": "如果空間上其實沒有結構"
  - "term": "silhouette"
    "route": "/space/"
    "explains": "離自己這一區、比離最近的另一區近多少"

  # ── Chapter 1: the primary entry point from the homepage's 從這裡開始 ─────────
  # `StartHere.astro` marks 先看全台趨勢 as its primary path, so this chapter is
  # where the most readers arrive first, and it was the one that explained least:
  # `holdout` appeared once on the whole site and nowhere with a meaning, and R²
  # was defined in chapter 6, five chapters after a reader meets it here.
  #
  # Both are glossed in the paragraph now. That paragraph is built by
  # `_deweather_caveat` in `src/twair/viz/story.py` rather than written in the
  # component, so the anchors below are the exporter's words and a reword there
  # is what will trip this.
  - "term": "holdout"
    "route": "/trend/"
    "explains": "把一段資料留著不給模型學"
  - "term": "R²"
    "route": "/trend/"
    "explains": "解釋掉的變異比例"

  # ── Chapter 8 ─────────────────────────────────────────────────────────────
  # Case 02's own definition is exemplary — 「PM10 是直徑 10 微米以下的顆粒，PM2.5
  # 是 2.5 微米以下的，後者被前者包含」 — but the seven-case index states the claim
  # 「拿 PM10 預測 PM2.5」 1,427 characters earlier, so the lede now names the two
  # sizes plainly and leaves the containment for the case to land.
  #
  # This was the mildest of the eight. A reader meeting the term in an index can
  # follow the link and find out; a reader meeting `persistence` in a chart
  # legend has to understand it to read the chart in front of them. The gate
  # measures distance, not harm, and those are not always the same thing.
  - "term": "PM10"
    "route": "/methods/"
    "explains": "兩種粒徑"
