# QA/QC 規則設定。
#
# 旗標定義逐字取自環境部隨資料附上的 `ReadMe_普通測站20170301.odt`：
#
#   #     表示儀器檢核為無效值
#   *     表示程式檢核為無效值
#   x     表示人工檢核為無效值
#   NR    表示無降雨
#   空白  表示缺值
#
# 注意本專案不接受「無效值就丟掉」的做法：無效值的**分布本身**
# （哪一站、哪一年、哪個測項特別多）是資料品質研究的一部分。

# 原始檔中的旗標符號 → 標準化 flag 值。
flag_tokens:
  "#": instrument_check_invalid   # 儀器檢核為無效值
  "*": program_check_invalid      # 程式檢核為無效值
  "x": manual_check_invalid       # 人工檢核為無效值
  "X": manual_check_invalid
  "NR": no_rain                   # 無降雨（非缺值，語意為「確實沒下雨」）
  "NA": not_applicable            # 僅見於新格式
  "A": rain_present               # 僅見於新格式（酸雨相關）
  "ND": below_detection_limit
  "": missing
  "-": missing

# 各格式世代對「旗標」與「數值」的處理方式不同 —— 這是長期趨勢分析的隱形陷阱。
#
#   舊格式（約 1994–2010，Big5 CSV / ODS）：旗標是**數值後綴**，如 `15#`、`0.1#`
#                                            → 無效值仍保留原始測值
#   新格式（約 2018 以後，UTF-8 CSV）：      旗標**整格取代數值**，如 `#`
#                                            → 無效值的原始測值已遺失
#
# 因此「無效值改用鄰近測站補」在新舊年代的意義不同，Phase 2 必須做敏感度分析。
flag_placement:
  legacy_suffix:
    description: 旗標附加在數值之後，測值保留
    example: "15#"
    retains_value: true
  modern_replacement:
    description: 旗標取代整個欄位，測值遺失
    example: "#"
    retains_value: false

# 缺漏填補策略。預設不填補 —— 原始畢業專題「以鄰近測站之資料代替」
# 是一句話帶過的黑盒，本專案把它變成可切換、可稽核、可比較的選項。
#
# 實作在 src/twair/qc/gapfill.py，比較在 src/twair/analysis/imputation.py
# （`uv run twair analyze m11`）。這裡的參數是那兩支唯一的來源：
# 一個填補率若不附上產生它的設定就無法被檢驗，所以參數不寫死在函式簽名裡。
#
# ⚠️ 這一整段都是**明示才會發生的事**。填補永遠不寫回資料庫，
# 每一個被發明出來的值都帶著 `<欄位>_imputed` 回來。
gapfill:
  default_strategy: none
  strategies:
    none:
      description: 不填補，分析時明確排除
    interpolate:
      description: 時間軸線性內插
      max_gap_hours: 3
    neighbor:
      description: 鄰近測站迴歸（復刻 2018 原專題做法，供對照）
      max_distance_km: 30
      min_correlation: 0.7
    iterative:
      description: 多變量疊代填補（MICE 類）
      max_iter: 10
  # 每筆填補值都必須帶 imputed=true 與 impute_method，絕不靜默填補。
  record_provenance: true

# 異常偵測：區分「儀器尖峰」與「真實污染事件」。
#
# 實作在 src/twair/qc/outliers.py（`uv run twair qc outliers`）。
# 這個模組只標記，不改 value / flag、不寫回資料庫、不補任何洞。
#
# ⚠️ `min_zscore` **不是高斯尾機率**。高斯單尾 z≥3 是 0.135% 的小時；
# 用這裡的統計量實測 PM2.5 2015 年官方認可的小時，命中率是 **3.11%**。
# 逐時濃度是強右偏的，而且尺度只由約 30 個點估計，本身就把尾巴撐胖。
# 所以「超標小時數」的絕對值一定很大，有意義的是它與**認可小時基準率**的比值——
# 兩者一律寫在同一列。
outliers:
  baseline:
    # 比較的母體是 (測站, 年, 月, 一日中的第幾小時)，約 30 筆。
    # 刻意不用滾動視窗：置中的滾動中位數會跟著持續性上升一起爬，
    # 實測 25 小時視窗對一段 36 小時、+60 μg/m³ 的階躍，**一個小時都測不到**。
    min_samples: 20
  spike:
    # 單站短暫尖峰、鄰站無同步反應 → 可疑
    max_duration_hours: 2
    neighbor_radius_km: 50
    min_neighbor_corroboration: 1
    # 資料庫的時戳是整點聚合值，煙流跨過整點會被算成「鄰站沒反應」。
    # 這是容差，不是傳輸時間比對——後者需要本專案刻意不做的軌跡模式。
    neighbor_lag_hours: 1
  event:
    # 多站同步上升 → 視為真實事件（境外傳輸／沙塵／逆溫）
    #
    # ⚠️ 括號裡那三個詞是**假設，不是結果**。這個模組只量得到「範圍」，
    # 量不到來源；要指名來源需要 analysis/sources.py 說明本專案不做的軌跡模式。
    min_stations: 3
    min_zscore: 3.0
  # 「好幾站一起上升」在不知道「本來就有多常一起上升」之前不代表任何事。
  # 把每個鄰站自己的超標序列平移整數週再算一次：這保留了它自己的發生率、
  # 叢集性與季節相位，只破壞同步性。差值就是「同一個小時」真正買到的東西。
  null_shift_days: [14, 28, 42]
  # 要掃的測項。圓形變數（風向）不在此列——中位數與 MAD 對角度沒有意義。
  # RAINFALL 也不在：約九成的格子是實測的 0，MAD 為 0，每個 z 都會是 null。
  pollutants: ["PM2.5", "PM10", "SO2", "NO2", "O3", "CO"]

# 聚合覆蓋率門檻。原始畢業專題直接把逐時平均成月值，
# 未檢查該月實際有多少有效小時 —— 這會讓資料稀疏的測站與完整測站等權。
aggregation:
  hourly_to_daily:
    min_valid_hours: 16          # 24 小時中至少 16 筆有效
  daily_to_monthly:
    min_valid_days_ratio: 0.75
  # 未達門檻者輸出 null 並記錄 coverage_ratio，而非輸出偏誤的平均值。
  emit_coverage_ratio: true
