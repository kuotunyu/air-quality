# Build and publish the website to GitHub Pages.
#
# This does not run until the repository has a GitHub remote AND Pages is
# switched to "GitHub Actions" under Settings → Pages. Until then the file is
# inert, which is deliberate: publishing is the owner's decision, not a side
# effect of pushing.
#
# The site builds from the data committed under web/public/data/, produced by
# `uv run twair export web`. CI has no copy of the 341M-row store and cannot
# regenerate it, so refreshing the site's data is a local step followed by a
# commit.

name: pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight, since a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # `github.repository` is owner/name; Pages serves a project site at
          # https://<owner>.github.io/<name>/, so both halves are needed.
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Verify the data layer made it into the build
        working-directory: web
        run: |
          test -f dist/data/meta.json || { echo "meta.json missing from build"; exit 1; }
          test -f dist/data/story/pitfalls.json || { echo "chapter 5 evidence missing"; exit 1; }
          echo "data layer present: $(du -sh dist/data | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
