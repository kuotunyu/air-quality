# Build and publish the website to GitHub Pages.
#
# This does not run until the repository has a GitHub remote AND Pages is
# switched to "GitHub Actions" under Settings → Pages. Until then the file is
# inert, which is deliberate: publishing is the owner's decision, not a side
# effect of pushing.
#
# The site builds from the data committed under web/public/data/, produced by
# `uv run twair export web`. CI has no copy of the 341M-row store and cannot
# regenerate it, so refreshing the site's data is a local step followed by a
# commit.

name: pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight, since a half-published
# site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          # `github.repository` is owner/name; Pages serves a project site at
          # https://<owner>.github.io/<name>/, so both halves are needed.
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/
          # The footer claims the work is open and prints the sha it was
          # exported at; both are links now, and a fork's build should point at
          # the fork rather than at this repository.
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build

      - name: Verify the complete Pages publication boundary
        run: node scripts/check_pages_publication.mjs

      # A source newline is whitespace in HTML, and Chinese has no inter-word
      # spaces — so every wrapped source line used to become a visible gap
      # mid-sentence. 248 of them, invisible to the type checker, the tests and
      # anyone not reading the Chinese. Checked on the real output because the
      # middleware that closes them only runs at render time.
      - name: No invented spaces inside Chinese sentences
        run: python scripts/check_cjk_spacing.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
