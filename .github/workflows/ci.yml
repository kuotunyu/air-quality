name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Dependencies
        run: uv sync --all-extras --group dev

      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type Check (MyPy)
        run: uv run mypy src tests

      # AGENTS.md and .github/copilot-instructions.md are the same rules read by
      # different agents. Nothing enforced that until the copy was found to be
      # unverifiable by hand — see scripts/mirror_agents.py.
      - name: Agent instructions mirror
        run: uv run python scripts/mirror_agents.py --check

      # The station map's county boundaries are simplified by three orders of
      # magnitude, and simplification can be wrong rather than merely coarse.
      # Both sides move: geometry when the generator is re-run, stations when
      # MOENV publishes a new register.
      - name: Every station lands in its own county
        run: uv run python scripts/validate_map_geometry.py

      # The export writes a manifest of everything it produced; nothing checked
      # that the manifest committed here covers the payloads committed here.
      # Two story files shipped outside it for two days. `twair status` said
      # STALE, which is advice, not a gate.
      - name: The published data matches its own manifest
        run: uv run python scripts/check_web_export.py

      - name: Test (Pytest)
        run: uv run pytest
