name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the default synthetic merge checkout for pull requests. The
          # identity gate below audits the proposed head revision explicitly.
          # Full history, because `check_web_export.py` verifies that the sha
          # the data export stamped is a commit this repository actually has.
          # The default depth-1 clone holds only the tip, so an export stamped
          # one commit earlier — which is every export — reads as missing.
          fetch-depth: 0

      - name: Install Astral uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync Dependencies
        run: uv sync --all-extras --group dev

      # The contributor panel can change through author metadata or a trailer;
      # checking only the latest commit misses both historical routes.
      - name: The published history keeps one identity
        run: uv run python scripts/check_history_identity.py "${{ github.event.pull_request.head.sha || github.sha }}"

      # The current tree can be clean while an older reachable blob still
      # discloses a protected identity. Full checkout history and the proposed
      # head SHA make this the same strict audit used before publication.
      - name: Protected identities stay out of every reachable text surface
        run: uv run python scripts/check_repository_anonymity.py "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Internal project memory stays out of published history
        run: uv run python scripts/check_internal_paths.py "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: The test inventory matches its reviewed count
        run: uv run python scripts/check_test_count.py

      # docs/methodology.md shipped seventeen links that resolved relative to
      # docs/, so every 「[src/twair/…](src/twair/…)」 was a 404 on GitHub. The
      # same file also held four correct `../` links, so it had been inconsistent
      # for a long time with nothing able to see it. The site's `repoFile()`
      # targets are checked too: they are strings, so moving `docs/legal.md`
      # would 404 the live page and the Astro build would not care. Offline:
      # external URLs are never fetched, because an upstream outage must not
      # redden this build.
      - name: Every link into this repository points at a file that exists
        run: uv run python scripts/check_internal_links.py

      - name: Lint (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # `scripts/` was outside the gate and had drifted: 5 errors in 3 files,
      # in a directory holding 2,892 lines including three of the checks this
      # workflow runs and the only reproduction path for M2.
      #
      # Two invocations, not `mypy src tests scripts`. `scripts/` is a folder of
      # standalone programs with no `__init__.py`, so passing it alongside the
      # package makes mypy resolve `check_web_export.py` both as a top-level
      # module and as `scripts.check_web_export`, and it refuses:
      # "Source file found twice under different module names". Splitting the
      # run is the honest fix — they are two different things being checked —
      # and it also reports which half is broken.
      - name: Type Check (MyPy)
        run: |
          uv run mypy src tests
          uv run mypy scripts

      # Importing from the checkout hid two packaging defects: wheels omitted
      # every reviewed YAML config, and the default sdist carried the complete
      # website and public data. Build both routes and execute the wheels from
      # an external workspace so this gate exercises what a user installs.
      - name: Python artifacts are self-contained and workspace-safe
        run: uv run python scripts/check_python_package.py

      # The palette's published numbers are solved by this file, and nothing
      # ran it — so PRODUCT.md quoted two dark-theme figures it does not
      # produce. It also used to exit 0 whatever it found; it now fails when a
      # SHIPPED palette fails, and still prints the rejected candidates, which
      # are supposed to fail and are the argument for what shipped.
      - name: The shipped palettes still clear their own gates
        run: uv run python scripts/check_palette.py

      # The station map's county boundaries are simplified by three orders of
      # magnitude, and simplification can be wrong rather than merely coarse.
      # Both sides move: geometry when the generator is re-run, stations when
      # MOENV publishes a new register.
      - name: Every station lands in its own county
        run: uv run python scripts/validate_map_geometry.py

      # The export writes a manifest of everything it produced; nothing checked
      # that the manifest committed here covers the payloads committed here.
      # Two story files shipped outside it for two days. `twair status` said
      # STALE, which is advice, not a gate.
      - name: The published data matches its own manifest
        run: uv run python scripts/check_web_export.py

      # `og.png` is committed and is the most-seen, least-checked surface the
      # project has — it is what people look at when deciding whether to open
      # the thing, and the last place anyone re-checks after a data refresh. It
      # now carries the facts it was drawn from inside the PNG, so this asks
      # whether it still describes the data that ships, without re-rendering
      # (PNG output is not reproducible across Pillow versions, and a check
      # that fails for that reason is a check that gets deleted).
      - name: The social card still describes the published data
        run: uv run python scripts/make_social_card.py --check

      # The M9 backtest table is retyped in four places for readers who are not
      # looking at the chart — the module docstring, methodology.md, and both
      # halves of the HuggingFace Space. Nothing connected them to the payload
      # the chart is drawn from, so a re-run updated the chart and left the four
      # copies saying whatever they said before. Which is exactly how the
      # three-item sentinel list ended up wrong in two of its three copies.
      - name: The forecast numbers in prose match the ones on the chart
        run: uv run python scripts/check_published_forecast.py

      # M6's figures are retyped in docs/methodology.md and PLAN.md for readers
      # who are not looking at the chart. Adding one station to the network moved
      # them; the report and the website regenerated with the run and those two
      # files did not, staying wrong for a day — inside the very commit that was
      # fixing a different instance of the same thing. Same shape as the check
      # above, against the committed spatial payload.
      - name: The spatial numbers in prose match the published payload
        run: uv run python scripts/check_published_spatial.py

      # The five figures on the first screen — the national fall, the weather
      # share, the independent per-station median, the PM10 leak's share of R²
      # and what sin/cos encoding buys — are retyped across six files and are the
      # most-read numbers this project publishes. test_public_readmes.py pins
      # them as strings, which catches a reword but not drift: when the analysis
      # moves, the honest fix updates prose and assertion together, and nothing
      # checks the new figure against the data.
      - name: The first-screen numbers match the data behind them
        run: uv run python scripts/check_published_headline.py

      # D10 states the whole M12 result three times over — the panel, the timing
      # table that prices the inconvenience, and the RMSE table that says what it
      # bought. Every figure was already a field in story/sarima.json; only the
      # copying stood between them.
      - name: The SARIMA numbers in prose match the published payload
        run: uv run python scripts/check_published_sarima.py

      # D8's detection table, plus the relation its conclusion rests on. 「測不到，
      # 不是等於零」 holds only while every event passes fewer stations than
      # chance predicts; updating the table cell by cell after a re-run would
      # leave that sentence standing on numbers that stopped supporting it, so
      # the relation is checked against the payload directly.
      - name: The detection limits in prose still support what is said about them
        run: uv run python scripts/check_published_detection.py

      # Every gate above reads Markdown. None read a `.astro` file, so the
      # chapters readers actually open were the one prose surface with nothing
      # watching it — and three figures had drifted there through the same
      # 60-to-61 station re-run that the Markdown copies were corrected for.
      # Reads `reports/03-spatial.md`, `pitfalls.json` and `manifest.json`, and
      # accepts a sentence that interpolates its number or hands it to the file
      # that recomputes it — but not one that has been deleted.
      - name: The website's own prose still matches what recomputes it
        run: uv run python scripts/check_published_site_prose.py

      - name: Test (Pytest)
        run: uv run pytest

  # The site had no gate that ran before a merge.
  #
  # `pages.yml` builds the site, but only `on: push` — so a pull request that
  # broke the Astro build, or reintroduced the mid-sentence spaces in Chinese
  # that check_cjk_spacing.py exists to catch, was green until it had already
  # landed. And `astro check` ran in no workflow at all, although AGENTS.md
  # requires it to print 0 errors: `astro build` does not type-check, so
  # web/src — 40 files — had no automated verification of any kind.
  #
  # Split from the Python job rather than bolted onto it so the two report
  # separately: a red mark should say which half of the project is broken.
  web:
    name: Web Build & Content Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Every gate in this job until now has been stdlib-only Python or Node,
      # and that was load-bearing rather than incidental: this job installs no
      # Python, so a gate importing anything would run green on a developer
      # machine — where `python3` happens to be an Anaconda build carrying
      # PyYAML — and red here. The first gate that needs a dependency is the
      # term gate below, so uv arrives with it. It runs `--no-project`, which
      # keeps Polars, LightGBM and statsmodels out of a Node job that has no
      # use for them.
      - name: Install Astral uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      # Before the build, because a type error is cheaper to read than a broken
      # page, and because this is the check AGENTS.md names by number.
      - name: Type Check (astro check)
        working-directory: web
        run: npx astro check

      - name: Build
        working-directory: web
        run: npm run build

      # A source newline is whitespace in HTML, and Chinese has no inter-word
      # spaces, so a wrapped source line becomes a visible gap mid-sentence.
      # Checked on the built output because the middleware that closes them only
      # runs at render time.
      - name: No invented spaces inside Chinese sentences
        run: python3 scripts/check_cjk_spacing.py

      # A chapter is named in five places and only one of them is the page's own
      # <h1>, so the <h1> is the one that drifts. It had drifted on three of the
      # ten chapters; two were still shipping when this gate was written.
      - name: Every chapter's <h1> matches the name the navigation uses
        run: python3 scripts/check_chapter_titles.py

      - name: Every chapter opens with the shared publication structure
        run: python3 scripts/check_publication_structure.py

      # The six prose gates in the other job all ask whether a number retyped
      # into prose still equals the number that produced it. None asks whether
      # the sentence around it can be read, and `PLAN.md` Phase 8 keeps the
      # non-expert reading deferred for want of a participant — so the site's
      # vocabulary had nothing watching it at all.
      #
      # This checks the one part of that a machine can decide: a term the site
      # has committed to explaining still carries that explanation, near where a
      # reader first meets it. It cannot judge whether the explanation is any
      # good; that is review, and `docs/working-rules.md` already draws the line.
      #
      # It reads the built pages rather than the `.astro` sources, because what
      # a reader meets is the render — and because the failures it was written
      # for are terms introduced by an index, a legend or a step list that only
      # exist in the composed page.
      - name: Every technical term is still explained where a reader meets it
        run: uv run --no-project --python 3.12 --with pyyaml python scripts/check_term_first_use.py

      # The non-expert reading `PLAN.md` Phase 8 had deferred finally happened on
      # 2026-08-24, and all three participants named chapter 3 as where they
      # disengaged. The third said what they did instead of leaving —
      # 「我主要看粗體結論」 — and that path was ten bare nouns mixed with four
      # conclusions, so it led nowhere.
      #
      # This holds the repair: emphasis in running prose has to say something
      # on its own. It is deliberately narrow — a chart's guide labels are data,
      # a card title is a heading, the no-JavaScript fallback is a second
      # rendering — and it cannot judge a long bare noun phrase. That part is
      # review, the same boundary `docs/working-rules.md` draws elsewhere.
      - name: Emphasis in prose says something on its own
        run: uv run --no-project --python 3.12 --with pyyaml python scripts/check_bold_stands_alone.py

      # PRODUCT.md's accessibility section states four measured properties, and
      # the nineteen throwaway browser scripts that produced them were deleted
      # on purpose — .gitignore says so in prose. So the one regression that
      # section documents, 26 dark-mode nodes under APCA Lc 60, was a class of
      # defect the repository could no longer detect. On its first run this
      # found two: the smallest-type figure could not be reproduced, and
      # chapter 3's axis had missed a type-size increase and sat below the prose
      # around it. Chrome is preinstalled on ubuntu-latest.
      # `--cdp-timeout-ms` raises how long the harness waits for headless Chrome
      # to open its debugging port, and nothing else. Every check the gate makes
      # is unchanged; this is patience with a browser starting on a shared
      # runner, not a loosened threshold.
      #
      # The default 15s has now timed out twice in CI on commits that could not
      # have caused it — the second time on a commit touching one Python script
      # this job does not run. Re-running the same commit passed. The job takes
      # minutes, so a genuine "Chrome is broken" failure surfacing 30s later
      # costs nothing, while a flake trains people to re-run red builds without
      # reading them.
      - name: The site still holds the design numbers PRODUCT.md publishes
        run: node scripts/check_site_quality.mjs --cdp-timeout-ms 45000
