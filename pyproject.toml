[project]
name = "twair"
version = "0.1.0"
description = "Taiwan air quality reanalysis: open data pipeline, reproducible analysis, and interactive visualisation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "air-quality" }]
keywords = ["air-quality", "pm25", "taiwan", "open-data", "reproducible-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Core: everything Phase 0-3 needs. Kept deliberately small so `uv sync` is fast
# and CI stays cheap; heavier scientific stacks live in optional groups below.
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "httpx>=0.28",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "selectolax>=0.3.27",
    "gdown>=5.2",
    "py7zr>=1.1.3",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
# Classical statistics — everything M1 (replication of the 2018 method) needs.
# Deliberately excludes the ML stack: shap pulls in numba, which needs a
# compiler toolchain, and M1 must stay installable without one.
analysis = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]
# Gradient boosting — M2 onwards.
#
# `shap` is deliberately absent. It depends on numba, which needs a compiler
# toolchain and resolves to a very old release here. LightGBM computes exact
# TreeSHAP values itself via `predict(..., pred_contrib=True)`, so the
# dependency buys nothing.
ml = [
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "libpysal>=4.12",
    "esda>=2.6",
    "pykrige>=1.7",
    "rasterio>=1.4",
]
earth = [
    "xarray>=2024.11",
    "netcdf4>=1.7",
    "cdsapi>=0.7",
    "earthengine-api>=1.4",
]
forecast = [
    "statsforecast>=2.0",
    "neuralforecast>=2.0",
]
publish = [
    "huggingface-hub>=0.27",
    "datasets>=3.2",
]
# Running the forecast demo locally. Kept out of the default install because
# gradio is large and nothing in the pipeline imports it — the Space installs
# from its own spaces/forecast/requirements.txt, which is the file that has to
# stay authoritative. The bound here matches it.
space = [
    "gradio>=5.9,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
twair = "twair.cli:app"

[project.urls]
Homepage = "https://github.com/kuotunyu/air-quality"
Repository = "https://github.com/kuotunyu/air-quality"
Dataset = "https://huggingface.co/datasets/steven0226/air-quality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twair"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode: this project legitimately mixes CJK and ASCII
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "gdown", "gdown.*", "selectolax", "selectolax.*", "duckdb", "duckdb.*",
    "shap", "shap.*", "lightgbm", "lightgbm.*", "pykrige", "pykrige.*",
    "esda", "esda.*", "libpysal", "libpysal.*", "ee", "ee.*", "scipy", "scipy.*",
    "statsmodels", "statsmodels.*", "matplotlib", "matplotlib.*", "pandas", "pandas.*",
    "geopandas", "geopandas.*", "xarray", "xarray.*", "netCDF4", "netCDF4.*",
    "cdsapi", "cdsapi.*", "statsforecast", "statsforecast.*", "neuralforecast", "neuralforecast.*",
    "datasets", "datasets.*", "huggingface_hub", "huggingface_hub.*", "py7zr", "py7zr.*",
    "xlrd", "xlrd.*"
]
ignore_missing_imports = true

# Tests keep their annotations — they document what each fixture hands back —
# but two strict checks are switched off here, and only here.
#
# `Series.__getitem__` in Polars is typed as a union of every value a cell
# could hold: int | float | Decimal | date | time | timedelta | str | bytes |
# ndarray | ... Mypy cannot narrow it, so an ordinary assertion such as
#
#     assert annual["coverage"][0] >= 0.75
#
# produces one `operator` error per member of that union. Across the suite that
# is 150 `operator` and 64 `union-attr` errors, none of which corresponds to a
# defect: every one is a comparison that is correct at runtime and checked by
# the assertion itself.
#
# Silencing them individually would mean 214 `# type: ignore` comments in the
# specification files, which is worse than the noise. `src/` stays fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["operator", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "network: test requires live network access (deselect with -m 'not network')",
    "slow: test takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/twair"]
branch = true
