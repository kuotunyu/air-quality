[project]
name = "twair"
version = "0.1.0"
description = "Taiwan air quality reanalysis: open data pipeline, reproducible analysis, and interactive visualisation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AirLens Taiwan" }]
keywords = ["air-quality", "pm25", "taiwan", "open-data", "reproducible-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Core: everything Phase 0-3 needs. Kept deliberately small so `uv sync` is fast
# and CI stays cheap; heavier scientific stacks live in optional groups below.
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "httpx>=0.28",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "selectolax>=0.3.27",
    "gdown>=5.2",
    "py7zr>=1.1.3",
    "xlrd>=2.0.2",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "shap>=0.46",
    "matplotlib>=3.9",
    "pingouin>=0.5.5",
]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "libpysal>=4.12",
    "esda>=2.6",
    "pykrige>=1.7",
    "rasterio>=1.4",
]
earth = [
    "xarray>=2024.11",
    "netcdf4>=1.7",
    "cdsapi>=0.7",
    "earthengine-api>=1.4",
]
forecast = [
    "statsforecast>=2.0",
    "neuralforecast>=2.0",
]
publish = [
    "huggingface-hub>=0.27",
    "datasets>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
twair = "twair.cli:app"

[project.urls]
Homepage = "https://github.com/OWNER/taiwan-air-quality"
Repository = "https://github.com/OWNER/taiwan-air-quality"
Dataset = "https://huggingface.co/datasets/OWNER/taiwan-air-quality"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twair"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode: this project legitimately mixes CJK and ASCII
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["gdown.*", "selectolax.*", "duckdb.*", "shap.*", "lightgbm.*", "pykrige.*", "esda.*", "libpysal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "network: test requires live network access (deselect with -m 'not network')",
    "slow: test takes more than a few seconds",
]

[tool.coverage.run]
source = ["src/twair"]
branch = true
