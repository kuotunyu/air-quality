# 2018 年畢業專題公布的數值，作為復刻的比對基準。
#
# 逐字抄自《台灣地區之 PM2.5 之影響分析》PDF，頁碼標於各節。
# 這份檔案是「原文主張」，不是「真值」——復刻的目的正是要查明哪些能重現、
# 哪些不能，以及為什麼。
#
# 資料範圍（第五章第一節）：2010–2017 年、8 個空品區、78 個測站、月平均。

study:
  period: [2010, 2017]
  aggregation: monthly_arithmetic_mean
  # 原文自身不一致：第三章說「全台約有 75 間測站，資料總筆數為 7386 筆」，
  # 第五章說「78 個測站」，而所有統計表都用 N = 7286。復刻以 7286 為準。
  n_observations: 7286
  n_stations_claimed_ch3: 75
  n_stations_claimed_ch5: 78
  n_rows_claimed_ch3: 7386
  response: PM2.5
  predictors:
    - AMB_TEMP
    - CO
    - "NO"
    - NO2
    - NOx
    - O3
    - PM10
    - RAINFALL
    - RH
    - SO2
    - WD_HR
    - WS_HR

# 敘述統計（p.35）。原表的「內四分位距」欄位在 PDF 中錯位一列，
# 因此僅採用可信的 min/median/mean/max/sd。
descriptive:
  PM2.5:    {min: 2.33,  median: 23.60,  mean: 26.17,  max: 78.66,  sd: 12.28}
  AMB_TEMP: {min: 7.42,  median: 24.58,  mean: 23.80,  max: 32.34,  sd: 4.87}
  CO:       {min: 0.04,  median: 0.40,   mean: 0.45,   max: 2.24,   sd: 0.25}
  "NO":       {min: 0.16,  median: 3.17,   mean: 5.54,   max: 110.27, sd: 9.32}
  NO2:      {min: 0.83,  median: 14.06,  mean: 15.01,  max: 54.04,  sd: 7.54}
  NOx:      {min: 1.78,  median: 17.28,  mean: 20.54,  max: 157.73, sd: 15.35}
  O3:       {min: 3.18,  median: 28.58,  mean: 29.51,  max: 65.63,  sd: 7.49}
  PM10:     {min: 7.15,  median: 45.10,  mean: 50.41,  max: 134.92, sd: 21.44}
  RAINFALL: {min: 0.0,   median: 0.144,  mean: 0.23,   max: 2.76,   sd: 0.27}
  RH:       {min: 57.37, median: 75.72,  mean: 75.91,  max: 98.17,  sd: 5.44}
  SO2:      {min: 0.38,  median: 3.13,   mean: 3.47,   max: 17.10,  sd: 1.59}
  WD_HR:    {min: 24.95, median: 166.71, mean: 161.32, max: 312.99, sd: 47.46}
  WS_HR:    {min: 0.28,  median: 1.54,   mean: 1.81,   max: 9.30,   sd: 1.05}

# 與 PM2.5 的 Pearson 相關係數（p.58，較 p.38 多兩位小數）。
correlation_with_pm25:
  AMB_TEMP: -0.39412
  CO:        0.33898
  "NO":        0.06395
  NO2:       0.49707
  NOx:       0.28297
  O3:        0.22861
  PM10:      0.88655
  RAINFALL: -0.42792
  RH:       -0.29689
  SO2:       0.48724
  WD_HR:     0.08872
  WS_HR:    -0.17058

# OLS 係數（p.49）。PDF 的表格排版錯亂，但同頁末尾的 β 清單完整可讀，
# 依變數順序對應如下。
ols_coefficients:
  Intercept: 2.65190
  AMB_TEMP: -0.24500
  CO:        1.38776
  "NO":        0.98901
  NO2:       1.42739
  NOx:      -1.18582
  O3:        0.09644
  PM10:      0.41339
  RAINFALL: -1.08202
  RH:        0.01463
  SO2:       0.46265
  WD_HR:     0.00737
  WS_HR:    -0.63411

# 變異數膨脹因子（p.49、p.51）。NO/NO2/NOx 的數值極端，
# 正是 NO + NO2 ≡ NOx 這個恆等式的必然結果。
vif:
  AMB_TEMP:  1.88461
  CO:       10.74569
  O3:        1.51427
  PM10:      2.42985
  RAINFALL:  1.49298
  RH:        1.59091
  SO2:       1.87519
  WD_HR:     1.62105
  WS_HR:     1.66306
  # 原文列為 15716 / 10273 / 42622，量級即為證據本身。
  "NO":    15716.0
  NO2:   10273.0
  NOx:   42622.0

# 原文各表刊出的 t 統計量中，唯一被本 repo 逐字記錄的一個（第五章，
# PM10：β=0.4133、t=92.75；PLAN.md 的 D2 列自始引用它）。M6 的推論價格表
# 從這裡讀，而不是把數字寫死在程式裡。
published_t:
  PM10: 92.75

# 原文的最終推論是 AR(1) 混合模型，但其標準誤與 t 統計量**沒有**被記錄在
# 本 repo 的任何地方——下方兩節只有係數與適合度。null 是刻意的：在把那些
# 數字從 PDF 抄錄進來之前，M6 只能為 OLS 階段定價，任何「推翻原文推論」
# 的說法都超出證據。是否抄錄是 owner 的決定。
mixed_model_standard_errors: null

# 混合模型（AR(1) 共變異結構，p.60）的固定效果估計。
# 值得注意：與 OLS 完全相同，顯示該模型的隨機結構未影響固定效果估計。
mixed_model_full:
  minus2_res_log_likelihood: 45007.8
  aic: 45009.8
  bic: 45016.7
  coefficients:
    Intercept: 2.6519
    AMB_TEMP: -0.2450
    CO:        1.3878
    "NO":        0.9890
    NO2:       1.4274
    NOx:      -1.1858
    O3:        0.09644
    PM10:      0.4134
    RAINFALL: -1.0820
    RH:        0.01463
    SO2:       0.4626
    WD_HR:     0.007369
    WS_HR:    -0.6341

# 逐步剔除後的最終 8 變數模型（p.63）。
mixed_model_final:
  aic: 45011.2
  bic: 45018.1
  dropped: [RH, NO, CO, NOx]
  coefficients:
    Intercept: 4.2329
    AMB_TEMP: -0.2554
    NO2:       0.4372
    NOx:      -0.1767
    O3:        0.09921
    PM10:      0.4133
    RAINFALL: -0.9928
    SO2:       0.4524
    WD_HR:     0.007364
    WS_HR:    -0.6627
